# After a merge to the default branch: deploy the live design site and tell everyone with it open to reload.
name: design-live
on:
  push:
    branches: [main]
    paths:
      - "packages/worktrees-studio-ds/**"
      - "packages/worktrees-studio-shared-ids/**"
      - "packages/ds-collab/**"
      - "modules/**"
      - "firebase.json"
      - "project.config.json"
      - "bun.lock"
      - "package.json"
permissions:
  contents: read
  id-token: write
concurrency:
  group: design-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - run: npm install -g firebase-tools@14
      - id: deploy
        run: bash scripts/ship/deploy-design.sh
      - name: Announce the new version to the design room
        if: vars.STUDIO_URL != ''
        uses: actions/github-script@v7
        env:
          STUDIO_URL: ${{ vars.STUDIO_URL }}
          STUDIO_AUDIENCE: ${{ vars.STUDIO_OIDC_AUDIENCE || vars.STUDIO_URL }}
          LIVE_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const token = await core.getIDToken(process.env.STUDIO_AUDIENCE);
            const res = await fetch(`${process.env.STUDIO_URL.replace(/\/$/, '')}/hooks/ci`, {
              method: 'POST',
              headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
              body: JSON.stringify({ event: 'live', url: process.env.LIVE_URL, sha: context.sha }),
            });
            if (!res.ok) core.warning(`Studio answered ${res.status}: ${await res.text()}`);
