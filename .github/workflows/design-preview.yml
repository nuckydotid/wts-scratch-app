# Every pull request (yours, a teammate's, Jules') gets its own copy of the design site on a Firebase Hosting preview
# channel. The URL is commented on the PR and announced to the project's design room in Worktrees Studio.
#
# Needs repository *variables* (not secrets) set by Worktrees Studio / `terraform output`:
#   GCP_WIF_PROVIDER  GCP_DEPLOY_SA  (Workload Identity Federation: no key is stored anywhere)
#   STUDIO_URL        (optional) the Worktrees Studio server, to announce the preview to the room
name: design-preview
on:
  pull_request:
    paths:
      - "packages/worktrees-studio-ds/**"
      - "packages/worktrees-studio-shared-ids/**"
      - "packages/ds-collab/**"
      - "modules/**"
      - "firebase.json"
      - "project.config.json"
      - "bun.lock"
      - "package.json"
permissions:
  contents: read
  pull-requests: write
  id-token: write
concurrency:
  group: design-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    # Pull requests from forks get no OIDC token (and must not get one); branches of this repo do.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - run: npm install -g firebase-tools@14
      - id: deploy
        env:
          DESIGN_CHANNEL: pr-${{ github.event.pull_request.number }}
          EXPO_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ship/deploy-design.sh
      - name: Comment the preview URL on the pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- design-preview -->';
            const body = `${marker}\n**Design preview:** ${process.env.PREVIEW_URL}\n\nBuilt from ${context.payload.pull_request.head.sha.slice(0, 7)}. Expires in 7 days.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - name: Announce the preview to the design room
        if: vars.STUDIO_URL != ''
        uses: actions/github-script@v7
        env:
          STUDIO_URL: ${{ vars.STUDIO_URL }}
          STUDIO_AUDIENCE: ${{ vars.STUDIO_OIDC_AUDIENCE || vars.STUDIO_URL }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const token = await core.getIDToken(process.env.STUDIO_AUDIENCE);
            const res = await fetch(`${process.env.STUDIO_URL.replace(/\/$/, '')}/hooks/ci`, {
              method: 'POST',
              headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
              body: JSON.stringify({ event: 'preview', url: process.env.PREVIEW_URL, sha: context.payload.pull_request.head.sha, pr: context.issue.number }),
            });
            // A missing room must not fail the build: the preview and the PR comment already exist.
            if (!res.ok) core.warning(`Studio answered ${res.status}: ${await res.text()}`);
